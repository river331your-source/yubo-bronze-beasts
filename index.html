<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="豫博青铜神兽录 — 河南出土动物形制青铜器数字交互展示"
    />
    <title>豫博青铜神兽录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="viewport-16-9">
      <div id="app">
      <section id="main-page" class="page active">
        <div class="main-vignette" aria-hidden="true"></div>

        <header class="site-header">
          <a class="nav-logo" href="#home" data-nav="home" aria-label="豫博青铜神兽录">
            <img src="/images/logo-title.png" alt="豫博青铜神兽录" />
          </a>
          <nav class="site-nav" aria-label="主导航">
            <button class="site-nav-item active" type="button" data-nav="home">
              <span class="site-nav-label">首页</span>
              <span class="site-nav-en">HOME</span>
              <span class="site-nav-line" aria-hidden="true"></span>
            </button>
            <button class="site-nav-item" type="button" data-nav="atlas">
              <span class="site-nav-label">形制溯源</span>
              <span class="site-nav-en">FORM &amp; ORIGIN</span>
            </button>
            <button class="site-nav-item" type="button" data-nav="pattern">
              <span class="site-nav-label">纹样解构</span>
              <span class="site-nav-en">PATTERN DECODED</span>
            </button>
            <button class="site-nav-item" type="button" data-nav="craft">
              <span class="site-nav-label">工艺解析</span>
              <span class="site-nav-en">CRAFT DECODED</span>
            </button>
            <button class="site-nav-item" type="button" data-nav="story">
              <span class="site-nav-label">关于</span>
              <span class="site-nav-en">ABOUT</span>
            </button>
          </nav>
          <div class="site-tools">
            <button class="site-tool-btn" type="button" aria-label="搜索">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1" />
                <path d="M15.5 15.5 L19 19" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
              </svg>
            </button>
            <button class="site-tool-btn" type="button" aria-label="音量">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 10 L10 10 L14 6 L14 18 L10 14 L6 14 Z" fill="none" stroke="currentColor" stroke-width="1" />
                <path d="M17 9 C18 10 18 14 17 15" fill="none" stroke="currentColor" stroke-width="1" />
              </svg>
            </button>
            <button class="site-tool-btn" type="button" aria-label="菜单">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 7 H19 M5 12 H19 M5 17 H19" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <nav class="m-corenav" aria-label="手机核心导航">
            <button class="site-nav-item" type="button" data-nav="atlas"><span class="site-nav-label">形制</span><span class="site-nav-line" aria-hidden="true"></span></button>
            <button class="site-nav-item" type="button" data-nav="atlas" data-mode="deconstruct"><span class="site-nav-label">解构</span><span class="site-nav-line" aria-hidden="true"></span></button>
            <button class="site-nav-item" type="button" data-nav="pattern"><span class="site-nav-label">捶拓</span><span class="site-nav-line" aria-hidden="true"></span></button>
          </nav>
          <div class="m-menuwrap">
            <button class="m-menu-btn" type="button" aria-label="菜单">☰</button>
            <div class="m-menu" hidden>
              <button class="site-nav-item" type="button" data-nav="home"><span class="site-nav-label">首页</span></button>
              <button class="site-nav-item" type="button" data-nav="story"><span class="site-nav-label">关于</span></button>
              <button class="site-nav-item m-guide-link" type="button" data-guide="open"><span class="site-nav-label">? 交互指南</span></button>
            </div>
          </div>
        </header>

        <div class="main-body" data-section="home">
          <!-- HOME 版块：六层绝对定位叠加 -->
          <div id="section-home" class="section-shell home-animate">
            <!-- ① 底色：纯黑 -->
            <div class="home-layer home-layer--base" aria-hidden="true"></div>

            <!-- ② 兽面纹背景 PNG -->
            <div class="home-layer home-layer--taotie" data-home-fallback="taotie" aria-hidden="true">
              <img
                class="home-taotie-img"
                data-home-asset="taotie"
                data-fallback="/images/网页背景.png"
                src="/images/home/bg-taotie.png"
                alt=""
                width="960"
                height="960"
                decoding="async"
              />
            </div>

            <!-- ③ 星图装饰：铺满 + 缓慢旋转 -->
            <div class="home-layer home-layer--starmap" data-home-fallback="starmap" aria-hidden="true">
              <div class="home-starmap-spin">
                <img
                  data-home-asset="starmap"
                  src="/images/home/bg-starmap.png"
                  alt=""
                  decoding="async"
                />
              </div>
            </div>

            <!-- ④ 标题 PNG -->
            <div class="home-layer home-layer--title" data-home-fallback="title">
              <img
                class="home-title-img"
                data-home-asset="title"
                data-fallback="/images/preview.webp"
                src="/images/title.png"
                alt="豫博神兽录"
                decoding="async"
              />
            </div>

            <!-- ⑤ 前景文案（HTML 文本 + 印章 PNG） -->
            <div class="home-layer home-layer--content">
              <span class="home-seal-wrap" data-home-fallback="seal">
                <img
                  class="home-seal"
                  data-home-asset="seal"
                  src="/images/home/seal.png"
                  alt=""
                  width="64"
                  height="64"
                  decoding="async"
                />
              </span>
              <div class="home-copy-block">
                <p class="home-subtitle">博物致知 · 数智对视</p>
                <p class="home-desc">河南出土动物形制青铜器 · 线上数字交互</p>
                <button id="enter-btn" class="enter-btn" type="button" aria-label="进入展厅">
                  <span class="enter-btn-ring">
                    <svg class="enter-btn-cross" viewBox="0 0 56 56" aria-hidden="true">
                      <line x1="28" y1="20" x2="28" y2="36" stroke="currentColor" stroke-width="1" />
                      <line x1="20" y1="28" x2="36" y2="28" stroke="currentColor" stroke-width="1" />
                    </svg>
                  </span>
                  <span class="enter-btn-text">进入展厅</span>
                  <span class="enter-btn-text-en">ENTER MUSEUM</span>
                </button>
              </div>
              <p class="home-vert home-vert--left" aria-hidden="true">洹四千年·神兽之一兽</p>
              <p class="home-vert home-vert--right" aria-hidden="true">探青铜文明之源</p>
            </div>
          </div>

          <!-- 中央舞台列：图鉴 WebGL 与纹样线稿分层隔离 -->
          <div id="stage-column" class="stage-column section-hidden">
            <div id="section-atlas" class="scene-stage scene-stage--atlas atlas-shell section-hidden">
              <!-- 神兽图鉴专属：左侧文物选择器 -->
              <aside id="artifact-nav" class="arc-nav">
                <!-- 左侧竖排「滚动切换」+ 圆形上一件按钮 -->
                <div class="arc-scroll-col">
                  <p class="arc-scroll-hint" aria-hidden="true">滚动切换</p>
                  <button
                    type="button"
                    class="arc-scroll-btn"
                    id="artifact-prev-btn"
                    aria-label="上一件文物"
                  >
                    <span class="arc-scroll-btn-icon" aria-hidden="true">‹</span>
                  </button>
                </div>
                <div class="arc-nodes" id="artifact-carousel"></div>
              </aside>

              <div id="atlas-viewport" class="atlas-viewport">
                <div id="model-loading" class="model-loading" hidden>
                  <span class="model-loading-ring" aria-hidden="true"></span>
                  <span class="model-loading-text">模型加载中…</span>
                </div>
                <canvas id="webgl-canvas"></canvas>
                <div id="clap-flash" class="clap-flash" aria-hidden="true"></div>
                <div class="artifact-info" id="artifact-info" hidden>
                  <h2 class="artifact-name">—</h2>
                  <p class="artifact-meta">—</p>
                </div>
                <div class="material-timeline" id="material-timeline" hidden>
                  <p class="material-stage-label" id="material-stage-label">出土现状·青绿铜锈</p>
                  <div class="material-slider-row">
                    <span class="material-slider-end">出土态</span>
                    <input
                      type="range"
                      id="material-restore-slider"
                      class="material-restore-slider"
                      min="0"
                      max="100"
                      value="0"
                      step="1"
                      aria-label="材质还原进度"
                    />
                    <span class="material-slider-end material-slider-end--gold">初铸态</span>
                  </div>
                  <p class="timeline-hint">拖动滑块，拂去千年铜锈见吉金</p>
                </div>
                <div class="touch-bar" id="touch-bar" hidden>
                  <button type="button" data-touch="gather">聚形</button>
                  <button type="button" data-touch="deconstruct">解构</button>
                  <button type="button" data-touch="dissolve">消散</button>
                  <button type="button" data-touch="next">下一件</button>
                </div>
              </div>
            </div>

            <div id="section-pattern" class="scene-stage scene-stage--pattern section-hidden">
              <!-- 纹样探秘：左侧器物切换（对齐形制溯源文物选择器） -->
              <nav
                id="pattern-side-switcher"
                class="pattern-side-switcher"
                aria-label="切换器物"
              >
                <button
                  type="button"
                  class="pattern-side-item active"
                  data-vessel-id="fuhao-xiao-zun"
                  aria-pressed="true"
                >
                  <span class="pattern-side-dot" aria-hidden="true"></span>
                  <span class="pattern-side-body">
                    <img
                      class="pattern-side-silhouette"
                      src="/images/relics/fuhao_xiaozun.png"
                      alt=""
                      decoding="async"
                      draggable="false"
                    />
                    <span class="pattern-side-label">
                      <span class="pattern-side-name">妇好鸮尊</span>
                      <span class="pattern-side-era">商代晚期</span>
                    </span>
                  </span>
                </button>
                <button
                  type="button"
                  class="pattern-side-item"
                  data-vessel-id="shenshou"
                  aria-pressed="false"
                >
                  <span class="pattern-side-dot" aria-hidden="true"></span>
                  <span class="pattern-side-body">
                    <img
                      class="pattern-side-silhouette"
                      src="/images/relics/shenshou_qingtong.png"
                      alt=""
                      decoding="async"
                      draggable="false"
                    />
                    <span class="pattern-side-label">
                      <span class="pattern-side-name">青铜神兽</span>
                      <span class="pattern-side-era">春秋晚期·楚</span>
                    </span>
                  </span>
                </button>
              </nav>

              <!-- 纹样探秘舞台：双层线稿 + 捶拓 -->
              <div class="pattern-torch-stage" id="pattern-torch-stage">
                <div class="pattern-torch-layers">
                  <div class="pattern-lineart-stack" style="--lineart-aspect: 24803 / 19928">
                    <img
                      class="pattern-lineart pattern-lineart--dim"
                      src="/patterns/artifacts/gong_lines.png"
                      alt="妇好鸮尊线稿"
                      draggable="false"
                    />
                    <img
                      class="pattern-lineart pattern-lineart--gold"
                      src="/patterns/artifacts/gong_lines.png"
                      alt=""
                      aria-hidden="true"
                      draggable="false"
                    />
                  </div>
                </div>
              </div>
            </div>

            <div class="stage-overlays">
              <div class="stage-hud" aria-hidden="true">
                <span class="stage-hud-corner stage-hud-tl"></span>
                <span class="stage-hud-corner stage-hud-tr"></span>
                <span class="stage-hud-corner stage-hud-bl"></span>
                <span class="stage-hud-corner stage-hud-br"></span>
              </div>
              <div class="camera-pip" id="camera-pip">
                <video id="camera-feed" autoplay playsinline muted></video>
                <canvas id="skeleton-overlay" aria-hidden="true"></canvas>
                <button type="button" class="pip-toggle" id="pip-toggle" aria-label="收起/展开摄像头">–</button>
              </div>
              <div class="interaction-hint" id="interaction-hint" hidden>
                握拳聚合 · 手势A拆解 · 手势B消散 · 双手拍合切换文物
              </div>
              <div class="gesture-status" id="gesture-status" hidden>
                <span class="gesture-dot"></span>
                <span id="gesture-label">等待摄像头…</span>
              </div>
            </div>
          </div>

          <div class="section-placeholder" id="section-placeholder" hidden>
            <p class="section-placeholder-en">—</p>
            <h2 class="section-placeholder-zh">—</h2>
            <p class="section-placeholder-desc">内容筹备中，敬请期待</p>
          </div>
        </div>
        <nav class="m-tabbar" aria-label="移动端导航">
          <button class="site-nav-item" type="button" data-nav="atlas"><span class="site-nav-label">形制</span></button>
          <button class="site-nav-item" type="button" data-nav="atlas" data-mode="deconstruct"><span class="site-nav-label">解构</span></button>
          <button class="site-nav-item" type="button" data-nav="pattern"><span class="site-nav-label">捶拓</span></button>
        </nav>
      </section>
      </div>
    </div>
    <div id="orientation-gate" class="orientation-gate" hidden>
      <div class="orientation-gate-inner">
        <div class="orientation-phone" aria-hidden="true"><span></span></div>
        <h2>豫博青铜神兽录</h2>
        <p class="orientation-title">请横屏体验</p>
        <p class="orientation-en">ROTATE YOUR DEVICE</p>
        <p class="orientation-desc">为获得完整的文物数字交互体验，<br />请将手机横置并开启屏幕自动旋转</p>
      </div>
    </div>
    <div id="camera-prompt" class="camera-prompt" hidden>
      <div class="camera-prompt-card">
        <h2>未开启摄像头</h2>
        <p>可继续使用触控模式体验作品</p>
        <p id="camera-prompt-hint" class="camera-prompt-hint" hidden></p>
        <div class="camera-prompt-actions">
          <button type="button" id="camera-retry-btn" class="camera-btn camera-btn--primary">重新开启摄像头</button>
          <button type="button" id="camera-touch-btn" class="camera-btn">使用触控模式</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
